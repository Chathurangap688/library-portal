# Lesson 15: deploy the website with an automatic version number.
# Every push to main: replace __VERSION__ in the files with "date-commit", then publish docs/.
# Browsers see a NEW file address (app.js?v=202609291030-a1b2c3d) → they cannot use an old cached copy.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:                  # a newer push cancels an older deploy that is still running
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version number
        run: |
          VERSION="$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}"
          echo "Version: $VERSION"
          sed -i "s/__VERSION__/$VERSION/g" docs/index.html docs/app.js docs/version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
