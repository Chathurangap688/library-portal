<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
  <!-- defer = download now, but run only after the whole page is built -->
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
  <!-- Lesson 4: Google's sign-in library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header>
    <h1>My Library</h1>

    <!-- Lesson 4: shown when signed OUT — Google draws its button in here -->
    <div id="signInButton"></div>

    <!-- Lesson 4: shown when signed IN -->
    <div id="userBox" hidden>
      <button id="addBookButton" type="button" hidden>+ Add book</button>
      <img id="userPicture" alt="" referrerpolicy="no-referrer">
      <span id="userName"></span>
      <span id="userRole" class="role"></span>
      <button id="signOutButton" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Lesson 2: search and filter controls -->
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search title, author or category…">

      <select id="language">
        <option value="">All languages</option>
        <option value="English">English</option>
        <option value="Sinhala">Sinhala</option>
        <option value="Tamil">Tamil</option>
      </select>

      <label>
        <input id="onlyTranslations" type="checkbox"> Translations only
      </label>
    </div>

    <p id="count"></p>

    <!-- JavaScript fills this empty box with book cards -->
    <div id="grid"></div>
  </main>

  <!-- Lesson 5: book detail popup. Hidden until dialog.showModal() -->
  <dialog id="bookDialog">
    <button type="button" id="closeDialog" aria-label="Close">×</button>
    <div id="bookDetail"></div>
  </dialog>

  <!-- Lesson 6: add / edit form (admins only) -->
  <dialog id="editDialog">
    <form id="bookForm">
      <h2 id="formTitle">Add a book</h2>
      <input type="hidden" name="id">

      <label>Title *<input name="title" required></label>
      <label>Author<input name="author"></label>
      <label>Categories <small>(comma separated)</small><input name="categories" placeholder="Fiction, History"></label>
      <div class="two">
        <label>Language
          <select name="language">
            <option>English</option><option>Sinhala</option><option>Tamil</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" name="isTranslation"> Translation</label>
      </div>
      <div class="two">
        <label>ISBN<input name="isbn" inputmode="numeric"></label>
        <label>Year<input name="year" inputmode="numeric"></label>
      </div>
      <div class="two">
        <label>Publisher<input name="publisher"></label>
        <label>Shelf<input name="shelf" placeholder="Rack A, shelf 2"></label>
      </div>

      <fieldset>
        <legend>Purchase details <small>(admins only)</small></legend>
        <div class="two">
          <label>Bought from<input name="purchasedFrom" placeholder="Sarasavi"></label>
          <label>Date<input name="purchaseDate" type="date"></label>
        </div>
        <label>Price (LKR)<input name="price" inputmode="decimal"></label>
        <label>Notes<textarea name="notes" rows="2"></textarea></label>
      </fieldset>

      <div class="form-buttons">
        <button type="button" id="cancelEdit">Cancel</button>
        <button type="submit" id="saveBook">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
