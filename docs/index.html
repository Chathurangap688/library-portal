<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
  <!-- defer = download now, but run only after the whole page is built -->
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
  <!-- Lesson 4: Google's sign-in library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header>
    <h1>My Library</h1>

    <!-- Lesson 4: shown when signed OUT — Google draws its button in here -->
    <div id="signInButton"></div>

    <!-- Lesson 4: shown when signed IN -->
    <div id="userBox" hidden>
      <img id="userPicture" alt="" referrerpolicy="no-referrer">
      <span id="userName"></span>
      <span id="userRole" class="role"></span>
      <button id="signOutButton" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Lesson 2: search and filter controls -->
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search title, author or category…">

      <select id="language">
        <option value="">All languages</option>
        <option value="English">English</option>
        <option value="Sinhala">Sinhala</option>
        <option value="Tamil">Tamil</option>
      </select>

      <label>
        <input id="onlyTranslations" type="checkbox"> Translations only
      </label>
    </div>

    <p id="count"></p>

    <!-- JavaScript fills this empty box with book cards -->
    <div id="grid"></div>
  </main>
</body>
</html>
