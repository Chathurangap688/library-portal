<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
  <!-- defer = download now, but run only after the whole page is built -->
  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
  <!-- Lesson 4: Google's sign-in library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header>
    <h1>My Library</h1>

    <!-- Lesson 4: shown when signed OUT — Google draws its button in here -->
    <div id="signInButton"></div>

    <!-- Lesson 4: shown when signed IN -->
    <div id="userBox" hidden>
      <button id="addBookButton" type="button" hidden>+ Add book</button>
      <img id="userPicture" alt="" referrerpolicy="no-referrer">
      <span id="userName"></span>
      <span id="userRole" class="role"></span>
      <button id="signOutButton" type="button">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Lesson 2: search and filter controls -->
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search title, author or category…">

      <select id="language">
        <option value="">All languages</option>
        <option value="English">English</option>
        <option value="Sinhala">Sinhala</option>
        <option value="Tamil">Tamil</option>
      </select>

      <!-- Category filter: multi-select dropdown. <details> opens/closes by itself, no JS needed -->
      <details id="categoryFilter" class="multi-select">
        <summary id="categorySummary">All categories</summary>
        <div class="multi-panel">
          <div id="categoryOptions"></div>
          <button type="button" id="clearCategories">Clear</button>
        </div>
      </details>

      <label>
        <input id="onlyTranslations" type="checkbox"> Translations only
      </label>
    </div>

    <!-- Lesson 8: only shown when signed in -->
    <section id="recommendSection" hidden>
      <h2>Recommended for you</h2>
      <div id="recommendRow" class="rec-row"></div>
    </section>

    <p id="count"></p>

    <!-- JavaScript fills this empty box with book cards -->
    <div id="grid"></div>
  </main>

  <!-- Lesson 5: book detail popup. Hidden until dialog.showModal() -->
  <dialog id="bookDialog">
    <button type="button" id="closeDialog" aria-label="Close">×</button>
    <div id="bookDetail"></div>
  </dialog>

  <!-- Lesson 6: add / edit form (admins only) -->
  <dialog id="editDialog">
    <form id="bookForm">
      <h2 id="formTitle">Add a book</h2>
      <input type="hidden" name="id">
      <input type="hidden" name="coverUrl">

      <!-- Lesson 7: photo → AI. capture="environment" opens the BACK camera on phones -->
      <div class="photo-box">
        <div class="photo-pick">
          <img id="photoPreview" alt="" hidden>
          <span id="photoHint">No photo yet</span>
        </div>
        <div class="photo-actions">
          <!-- Two inputs: capture="environment" = open the camera; without it = photo gallery / files -->
          <div class="pick-buttons">
            <label class="pick-btn">📷 Camera
              <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
            </label>
            <label class="pick-btn">🖼️ Gallery
              <input id="galleryInput" type="file" accept="image/*" hidden>
            </label>
          </div>
          <button type="button" id="analyzeButton" disabled>✨ Read cover with AI</button>
          <p id="aiStatus"></p>
        </div>
      </div>

      <label>Title *<input name="title" required></label>
      <label>Author<input name="author"></label>
      <div class="two">
        <label>Title in English letters <small>(Singlish)</small><input name="titleSinglish" placeholder="Madol Doowa"></label>
        <label>Author in English letters<input name="authorSinglish" placeholder="Martin Wickramasinghe"></label>
      </div>
      <!-- Lesson 7d: pick categories by tapping chips (list comes from the server) -->
      <div class="field">
        <span class="field-label">Categories <small>(tap to select)</small></span>
        <div id="categoryChips" class="chips"></div>
        <div class="row">
          <input id="customCategory" placeholder="Other category…">
          <button type="button" id="addCategory">Add</button>
        </div>
      </div>
      <div class="two">
        <label>Language
          <select name="language">
            <option>English</option><option>Sinhala</option><option>Tamil</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" name="isTranslation"> Translation</label>
      </div>

      <!-- Lesson 7d: only shown when "Translation" is ticked -->
      <div id="translationFields" hidden>
        <label>Translator<input name="translator" placeholder="Name of the translator"></label>
        <div class="two">
          <label>Original title<input name="originalTitle"></label>
          <label>Original author<input name="originalAuthor"></label>
        </div>
      </div>

      <!-- Lesson 7d: web lookup -->
      <div class="web-box">
        <button type="button" id="webButton">🔎 Find more on the web</button>
        <span id="webStatus"></span>
      </div>
      <!-- Results appear here: tick what you want, then Apply (works when adding AND editing) -->
      <div id="webResults" hidden></div>
      <label>Description<textarea name="description" rows="3"></textarea></label>
      <label>What readers say<textarea name="reviewSummary" rows="2"></textarea></label>
      <input type="hidden" name="webSources">
      <div class="two">
        <label>ISBN<input name="isbn" inputmode="numeric"></label>
        <label>Year<input name="year" inputmode="numeric"></label>
      </div>
      <div class="two">
        <label>Publisher<input name="publisher"></label>
        <label>Shelf<input name="shelf" placeholder="Rack A, shelf 2"></label>
      </div>

      <fieldset>
        <legend>Purchase details <small>(admins only)</small></legend>
        <div class="two">
          <label>Bought from<input name="purchasedFrom" placeholder="Sarasavi"></label>
          <label>Date<input name="purchaseDate" type="date"></label>
        </div>
        <label>Price (LKR)<input name="price" inputmode="decimal"></label>
        <label>Notes<textarea name="notes" rows="2"></textarea></label>
      </fieldset>

      <div class="form-buttons">
        <button type="button" id="cancelEdit">Cancel</button>
        <button type="submit" id="saveBook">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
