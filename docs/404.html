<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Library has moved</title>
  <!-- Lesson 4.6: v1 is retired. Everyone goes to v2.
       GitHub Pages can't send a real HTTP 301, so we use the two browser-side ways:
       1) JavaScript location.replace()  → instant, and doesn't leave v1 in the Back history
       2) <meta http-equiv="refresh">    → works even with JavaScript turned off
       Old book links can't be mapped: v2 gave every book a new id, so all paths go to the v2 home page. -->
  <meta http-equiv="refresh" content="0; url=https://library.bmcpthilakawansha.workers.dev/">
  <link rel="canonical" href="https://library.bmcpthilakawansha.workers.dev/">
  <meta name="robots" content="noindex">
  <script>location.replace('https://library.bmcpthilakawansha.workers.dev/');</script>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f2ec; color: #1f2a28; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; text-align: center; }
    a { color: #1f4d45; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p style="font-size: 2.5rem; margin: 0">📚</p>
    <h1>My Library has moved</h1>
    <p>Taking you to the new library… If nothing happens, <a href="https://library.bmcpthilakawansha.workers.dev/">open it here</a>.</p>
  </main>
  
</body>
</html>
